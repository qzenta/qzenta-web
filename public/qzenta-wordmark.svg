<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <!-- Background -->
  <rect width="600" height="200" fill="#111827" rx="16"/>
  <!-- Wordmark: Q in emerald, zenta in white -->
  <text
    x="300"
    y="118"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="80"
    font-weight="700"
    letter-spacing="-2"
    text-anchor="middle"
  >
    <tspan fill="#10b981">Q</tspan><tspan fill="#f1f5f9">zenta</tspan>
  </text>
  <!-- Tagline -->
  <text
    x="300"
    y="155"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="18"
    font-weight="400"
    letter-spacing="3"
    text-anchor="middle"
    fill="#6b7280"
  >QUIETLY EXCELLENT.</text>
</svg>
